name: deepgemm ut test

on:
  workflow_call:
    inputs:
      matrix:
        required: false
        type: string
        default: '["ZW-M890P", "ZW-810E"]'
      source_mode:
        description: "Source layout mode. Supported values: deepgemm, actlize1.0.0."
        required: false
        type: string
        default: deepgemm
  workflow_dispatch:
    inputs:
      matrix:
        description: "JSON array of PPU runner board types"
        required: false
        type: string
        default: '["ZW-M890P", "ZW-810E"]'
      source_mode:
        description: "Source layout mode. Supported values: deepgemm, actlize1.0.0."
        required: false
        type: string
        default: deepgemm

permissions:
  contents: read

env:
  PPU_BASE_IMAGE: ${{ secrets.PPU_BASE_IMAGE }}
  SAIL_IMAGE: download.t-head.cn/docker_release/pytorch:sdk2.2.0-2.10.0-ubuntu24.04-hggcrt3-py312-20261005

jobs:
  build-test:
    name: Build & Test (${{ matrix.runner }})
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    # The command includes setup, wheel construction, parallel cold-cache JIT
    # compilation and serial accuracy checks. Retain the existing ceiling
    # until board measurements establish a smaller end-to-end limit.
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        # Each board selects a functional caselist via run_checkin.py --suite.
        # Compile in isolated processes, then execute accuracy checks serially.
        runner: ${{ fromJson(inputs.matrix || '["ZW-M890P", "ZW-810E"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Fetch submodules (e.g. third-party/actlize_*, third-party/fmt) at checkout time, recursively.
          submodules: recursive
          persist-credentials: false
      - name: Build and Test on PPU
        id: ppu-test
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: ${{ env.SAIL_IMAGE }}
          container_options: |
            cpus: "40"
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=${{ matrix.runner }}"
          namespace: ppu-sched
          # Ceiling for environment setup, wheel build and both check-in phases.
          # Each case also has a separate timeout in run_checkin.py.
          timeout_minutes: 420
          command: |
            set -ex
            # Fix the image's unreachable pip and GitHub mirror settings before cloning sources.
            unset PIP_INDEX_URL
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            git config --global --add safe.directory '*'
            SOURCE_MODE='${{ inputs.source_mode }}'
            case "$SOURCE_MODE" in
              ""|deepgemm)
                cd /workspace/source
                ;;
              actlize1.0.0)
                cd /workspace
                DEEPGEMM_SOURCE=$(mktemp -d /workspace/deepgemm-source.XXXXXX)
                rmdir "$DEEPGEMM_SOURCE"
                git clone --recurse-submodules -b main \
                  https://github.com/t-head/DeepGEMM-for-sail.git "$DEEPGEMM_SOURCE"
                ACTLIZE_V100_SOURCE=$(mktemp -d /workspace/actlize-v100-source.XXXXXX)
                rmdir "$ACTLIZE_V100_SOURCE"
                mv /workspace/source "$ACTLIZE_V100_SOURCE"
                rm -rf "$DEEPGEMM_SOURCE/third-party/actlize_v1.0.0"
                mkdir -p "$DEEPGEMM_SOURCE/third-party"
                mv "$ACTLIZE_V100_SOURCE" "$DEEPGEMM_SOURCE/third-party/actlize_v1.0.0"
                mv "$DEEPGEMM_SOURCE" /workspace/source
                cd /workspace/source
                ;;
              *)
                echo "Unsupported source_mode: $SOURCE_MODE"
                exit 1
                ;;
            esac
            # PPU SDK and torch are pre-installed in the docker image
            source /usr/local/PPU_SDK/envsetup.sh || true
            which hgcc || true
            echo $PPU_SDK
            pip install ray[adag]==2.40.0 --no-deps
            pip install setuptools==69.5.1
            # Match setup.py setup_requires exactly so the build never re-fetches it from the (unreachable) internal index.
            pip install setuptools-scm==9.2.2
            pip install numpy==1.26.4 junit-xml rich
            pip install --upgrade pytest
            export MAX_JOBS=20
            export PYTORCH_SAIL_ARCH="ppu_10;ppu_15"
            # Submodules are initialized by checkout or the source_mode clones above.
            echo "START TO BUILD WHEEL"
            LOG_FILE="build.log"
            ERROR_LOG="error.log"
            echo "Building wheel..."
            python ./setup.py bdist_wheel > "$LOG_FILE" 2> "$ERROR_LOG"
            EXIT_CODE=$?

            if [ $EXIT_CODE -ne 0 ]; then
                echo "Build failed with exit code $EXIT_CODE"
                cat "$ERROR_LOG"
                echo "----- last 1000 lines of $LOG_FILE -----"
                tail -n 1000 "$LOG_FILE"
                exit 1
            else
                echo "✅ Build succeeded!"
                echo "----- last 200 lines of $LOG_FILE -----"
                tail -n 200 "$LOG_FILE"
            fi
            echo "START TO INSTALL WHEEL"
            pip install ./dist/*.whl --force-reinstall
            echo "START TO TEST CASES"
            set +e
            python tests/checkin/run_checkin.py \
              --suite ${{ matrix.runner }} \
              --compile-workers 16
            TEST_EXIT_CODE=$?
            python3 .github/workflows/scripts/generate-env-info.py \
            --docker-image "${{ env.SAIL_IMAGE }}" \
            --output env_info.json
            # Keep results per runner so the parallel matrix jobs do not collide.
            NAS_RESULT_DIR="/mnt/wl_nas/devops/deepgemm-ci/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}"
            mkdir -p "$NAS_RESULT_DIR"
            cp test-results.xml "$NAS_RESULT_DIR/" 2>/dev/null || true
            cp env_info.json "$NAS_RESULT_DIR/" 2>/dev/null || true
            cp -r checkin-logs "$NAS_RESULT_DIR/" 2>/dev/null || true
            exit "$TEST_EXIT_CODE"
          cleanup_policy: on_success

      - name: Test summary (${{ matrix.runner }})
        if: always()
        shell: bash
        run: |
          NAS_RESULT_DIR="/wl_nas/devops/deepgemm-ci/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.runner }}"
          XML_FILE="$NAS_RESULT_DIR/test-results.xml"
          ENV_FILE="$NAS_RESULT_DIR/env_info.json"
          echo "## Runner: ${{ matrix.runner }}" >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -f "$XML_FILE" ]]; then
            echo "JUnit report not found: $XML_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          python3 .github/workflows/scripts/display-test-summary.py \
            "$XML_FILE" --env-info "$ENV_FILE"
