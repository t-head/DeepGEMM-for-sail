name: deepgemm checkin     # ① Workflow 名称（显示在 Actions 页面）

# ② 触发条件
on:
  workflow_dispatch:                                       # 支持手动触发（网页/API）
  pull_request:
    branches: [main, 'feature/add-ci-workflow']                                       # 目标 main 的 PR
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, 'feature/add-ci-workflow']                                       # 合入 main 后再跑一次

permissions:                    # ③ Token 权限
  contents: read
  packages: write
  pull-requests: write
  statuses: write

concurrency:
  group: ci-ppu-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true                 # 新运行自动取消旧的

env:
  PPU_BASE_IMAGE: ${{ secrets.PPU_BASE_IMAGE }}
  SAIL_IMAGE: reg.docker.alibaba-inc.com/ai-tmp/pytorch:2.10.0-ubuntu24.04-hggcrt3-py312-ppu202609181903

jobs:
  # ─── Stage 1: Precheck (reusable) ───
  # precheck:
  #   name: Pre-check & Lint
  #   uses: t-head/.github/.github/workflows/user-precheck.yml@main
  build-test:
    name: Build & Test
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJson(inputs.matrix || '["ZW-M890P"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the base..head diff below resolves both ends.
          fetch-depth: 0
          # Fetch submodules (e.g. third-party/actlize_*, third-party/fmt) at checkout time, recursively.
          submodules: recursive
      - name: Build and Test on PPU
        id: ppu-test
        uses: t-head/ppu-scheduler-action@main
        with:
          image: ${{ env.SAIL_IMAGE }}
          nnodes: 0
          nproc_per_node: 1
          node_selector: "board-type=${{ matrix.runner }}"
          namespace: ppu-sched
          timeout_minutes: 300
          command: |
            cd /workspace/source
            # Fix: image bakes in PIP_INDEX_URL pointing to unreachable internal server
            unset PIP_INDEX_URL
            # Fix: image bakes in git insteadOf redirecting github.com to unreachable internal gerrit
            git config --global --unset-all url.https://ai-gerrit.eng.t-head.cn/Public/Github/.insteadOf 2>/dev/null || true
            # PPU SDK and torch are pre-installed in the docker image
            source /usr/local/PPU_SDK/envsetup.sh || true
            which hgcc || true
            echo $PPU_SDK
            pip install ray[adag]==2.40.0 --no-deps
            pip install setuptools==69.5.1
            # Match setup.py setup_requires exactly so the build never re-fetches it from the (unreachable) internal index.
            pip install setuptools-scm==9.2.2
            pip install numpy==1.26.4 junit-xml rich
            pip install --upgrade pytest
            export MAX_JOBS=20
            export PYTORCH_SAIL_ARCH="ppu_10;ppu_15"
            echo "START TO INIT SUBMODULES"
            git config --global --add safe.directory /workspace/source
            # git treats each submodule (e.g. third-party/actlize_*) as its own repo and checks ownership separately,
            # so a wildcard exception is needed to cover all (possibly nested) submodule repos too.
            git config --global --add safe.directory '*'
            git submodule update --init --recursive
            # actlize temporarily deleted
            # dirs and clone the latest code of the target branch directly.
            rm -rf ./third-party/actlize_v0.5.0 ./third-party/actlize_v1.0.0
            git clone -b v0.5.0 --depth 1 https://github.com/t-head/actlize.git ./third-party/actlize_v0.5.0
            git clone -b v1.0.0 --depth 1 https://github.com/t-head/actlize.git ./third-party/actlize_v1.0.0
            echo "START TO BUILD WHEEL"
            LOG_FILE="build.log"
            ERROR_LOG="error.log"
            echo "开始构建 wheel..."
            python ./setup.py bdist_wheel > "$LOG_FILE" 2> "$ERROR_LOG"
            EXIT_CODE=$?

            # 3. 检查返回值
            if [ $EXIT_CODE -ne 0 ]; then
                echo "Build failed with exit code $EXIT_CODE"
                cat "$ERROR_LOG" # 显示错误详情
                echo "----- last 1000 lines of $LOG_FILE -----"
                tail -n 1000 "$LOG_FILE"
                exit 1
            else
                echo "✅ 构建成功！"
                echo "----- last 200 lines of $LOG_FILE -----"
                tail -n 200 "$LOG_FILE"
                # 可选：清理日志或保留以备查
                # rm "$LOG_FILE" "$ERROR_LOG"
            fi
            echo "START TO INSTALL WHEEL"
            pip install ./dist/*.whl --force-reinstall
            echo "START TO TEST CASES"
            set +e
            python .github/workflows/scripts/pr-deepgemm-ut.py \
              --caselist .github/workflows/scripts/casecmd.list
            TEST_EXIT_CODE=$?
            # Record the runtime environment alongside the JUnit report.
            python3 <<'PYEOF' > env_info.json
            import json
            import os
            import shutil
            import subprocess
            import sys

            def command_output(command):
                executable = command[0]
                if not shutil.which(executable):
                    return "not found"
                result = subprocess.run(command, text=True, capture_output=True, check=False)
                return (result.stdout or result.stderr).strip()

            info = {
                "docker_image": "${{ env.SAIL_IMAGE }}",
                "python_version": sys.version,
                "ppu_sdk": os.environ.get("PPU_SDK", ""),
                "ppu_home": os.environ.get("PPU_HOME", ""),
                "hggc_enable_compress": os.environ.get("HGGC_ENABLE_COMPRESS", ""),
                "pytorch_sail_arch": os.environ.get("PYTORCH_SAIL_ARCH", ""),
                "hggcc_version": command_output(["hggcc", "--version"]),
                "hggcrt_version": command_output(["hggcrt", "--version"]),
            }
            try:
                import torch
                info["torch_version"] = torch.__version__
            except ImportError:
                info["torch_version"] = "not found"
            print(json.dumps(info, indent=2, sort_keys=True))
            PYEOF
            # Copy the JUnit report and runtime information to NAS for the runner.
            NAS_RESULT_DIR="/mnt/wl_nas/devops/deepgemm-ci/${{ github.run_id }}/${{ github.run_attempt }}"
            mkdir -p "$NAS_RESULT_DIR"
            cp test-results.xml "$NAS_RESULT_DIR/" 2>/dev/null || true
            cp env_info.json "$NAS_RESULT_DIR/" 2>/dev/null || true
            exit "$TEST_EXIT_CODE"
          cleanup_policy: on_success

      - name: Test summary
        if: always()
        shell: bash
        run: |
          NAS_RESULT_DIR="/wl_nas/devops/deepgemm-ci/${{ github.run_id }}/${{ github.run_attempt }}"
          XML_FILE="$NAS_RESULT_DIR/test-results.xml"

          if [[ ! -f "$XML_FILE" ]]; then
            echo "JUnit report not found: $XML_FILE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 .github/workflows/scripts/display-test-summary.py "$XML_FILE"
