name: Release Pypi

# Call the standalone template repository ppu-release-action; uses and template_ref must reference the same version.
# Configure RELEASE_USERNAME, RELEASE_TOKEN, and DATA_TOKEN as Actions secrets in the calling repository or at the organization level with access granted to the calling repository.
# Save release wheel artifacts when triggered by a tag.
on:
  # Trigger automatically only on tag pushes, or manually with specified parameters.
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Name of the package to build and publish'
        required: true
        type: string
        default: deep_gemm
      framework:
        description: 'Name of the required framework, e.g. torch'
        required: true
        type: string
        default: torch
      python_versions:
        description: 'JSON array; available values: 38, 310, 312'
        required: true
        type: string
        default: '["312"]'
      os_versions:
        description: 'JSON array; available values: ubuntu2004, ubuntu2204, ubuntu2404, alios7u2'
        required: true
        type: string
        default: '["ubuntu2404"]'
      runtime_versions:
        description: 'JSON array; available values: 2, 3'
        required: true
        type: string
        default: '["3"]'
      torch_versions:
        description: 'JSON array; available values: 2.8.0, 2.10.0, 2.13.0; [""] omits the Torch version'
        required: true
        type: string
        default: '["2.10.0"]'
      sdk_versions:
        description: 'JSON array; available values: 2.1.0, 2.2.0'
        required: true
        type: string
        default: '["2.2.0"]'
      tag_version:
        description: 'Code version: manually specify a tag when building and publishing multiple wheel packages'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    uses: t-head/ppu-release-action/.github/workflows/matrix-release.yml@master
    permissions:
      contents: write
    secrets:
      template_token: ${{ secrets.TEMPLATE_TOKEN }}
      release_username: ${{ secrets.RELEASE_USERNAME }}
      release_token: ${{ secrets.RELEASE_TOKEN }}
      data_token: ${{ secrets.DATA_TOKEN }}
    with:
      # Manual runs use the specified parameters; tag pushes have no inputs and use the same defaults as manual runs.
      package_name: ${{ inputs.package_name || 'deep_gemm' }}
      framework: ${{ inputs.framework || 'torch' }}
      template_repository: t-head/ppu-release-action
      template_ref: master
      python_versions: ${{ inputs.python_versions || '["312"]' }}
      os_versions: ${{ inputs.os_versions || '["ubuntu2404"]' }}
      runtime_versions: ${{ inputs.runtime_versions || '["3"]' }}
      torch_versions: ${{ inputs.torch_versions || '["2.10.0"]' }}
      sdk_versions: ${{ inputs.sdk_versions || '["2.2.0"]' }}
      tag_version: ${{ inputs.tag_version || ''}}
      build_command: |
        unset PIP_INDEX_URL
        source /usr/local/PPU_SDK/envsetup.sh || true
        which hgcc || true
        echo $PPU_SDK
        pip install ray[adag]==2.40.0 --no-deps
        pip install setuptools==69.5.1
        pip install setuptools-scm==9.2.2
        pip install numpy==1.26.4 junit-xml rich
        python3 -m pip install wheel ninja
        python3 -m pip show setuptools setuptools-scm packaging
        export PYTORCH_SAIL_ARCH="ppu_10;ppu_15"
        python3 setup.py bdist_wheel
